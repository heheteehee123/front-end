<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello</title>
  <style>
    body {
      background: #000;
      color: #fff;
    }

    h1 {
        font-size: 0.9rem;
        font-family: monospace;
        text-align: center;
    }

    button {
        background: #000000;
        color: #9db0cf;

        border-radius: 10px;
    }
  </style>
</head>
<body>
<button onclick="toggleMode()">Show Text</button>
<h1>Nuttings</h1>  
    
    <script>
        let darkMode = 1
        
     function toggleMode() {
         if (darkMode = 1) {
            document.querySelector('body').style.background = "#000"
             darkMode = 0
         } else {
           document.querySelector('body').style.background = "#fff"  
             darkMode = 1
         }
             
     }

   
   </script> 
</body>
</html>
